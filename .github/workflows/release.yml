name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          .output/*-firefox.zip
          .output/*-sources.zip
          --generate-notes
          --title "Tabitha Workspaces $GITHUB_REF_NAME"
